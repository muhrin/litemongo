[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"


[project]
name = "litemongo"
dynamic = ["version"]
description = "File based MongoDB server with pymongo compatible API."
authors = [{ name = "Martin Uhrin", email = "martin.uhrin.10@ucl.ac.uk" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    "Topic :: Scientific/Engineering"
]
keywords = ["mongodb", "database", "sqlite", "disk-based"]
requires-python = ">=3.11"
dependencies = [
#    "mongomock @ git+https://github.com/muhrin/mongomock.git@extended-serverstore-support",
    "pymongo",
    "setuptools",
    # needed by mongomock:
    "packaging",
    "pytz",
    "sentinels",
]
[project.optional-dependencies]
backends = [
    "h5py",
    "tables",
]

[dependency-groups]
dev = [
    "flit",
    "pre-commit",
    "pylint",
    "pytest",
    "ruff",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/litemongo/_vendor"]

[tool.ruff.format]
exclude = ["docs/**", "tests/**"]

[tool.ruff.lint]
# Equivalent of the previous flake8 (pyflakes, pycodestyle, mccabe) and isort checks
select = ["E", "F", "W", "C90", "I"]
ignore = ["E501", "F401", "F403"]

[tool.ruff.lint.per-file-ignores]
# Tests and docs were not import-sorted before the switch to ruff
"tests/**" = ["I"]
"docs/**" = ["I"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.pylint.MASTER]
ignore-paths = '^src/litemongo/_vendor/'

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
    # Unfortunately jaxtyping decorator creates a function that seems to mistakenly be identified as
    # not returning anything, so we have to disable the error below for now
    'assignment-from-no-return',
    'duplicate-code',
    'import-outside-toplevel',
    'missing-docstring',
    'locally-disabled',
    'too-few-public-methods',
    'too-many-instance-attributes',
    'use-dict-literal',
    'undefined-all-variable',
]

[tool.pylint.design]
max-args = 10
max-locals = 20
max-parents = 12


[tool.commitizen]
tag_format = "v$major.$minor.$patch"
[tool.bandit]
exclude_dirs = ["tests", "src/litemongo/_vendor"]
