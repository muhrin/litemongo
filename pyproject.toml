[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"


[project]
name = "litemongo"
dynamic = ["version"]
description = "File based MongoDB server with pymongo compatible API."
authors = [{ name = "Martin Uhrin", email = "martin.uhrin.10@ucl.ac.uk" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    "Topic :: Scientific/Engineering"
]
keywords = ["mongodb", "database", "sqlite", "disk-based"]
requires-python = ">=3.8"
dependencies = [
#    "mongomock @ git+https://github.com/muhrin/mongomock.git@extended-serverstore-support",
    "pymongo",
    "setuptools",
    # needed by mongomock:
    "packaging",
    "pytz",
    "sentinels",
]
[project.optional-dependencies]
dev = [
    'black[d]',
    'flit',
    'pre-commit',
    'pytest',
]
backends = [
    "h5py",
    "tables",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | (.*)/migrations
    | dist
  )/
)
'''

[tool.isort]
profile = "black"
force_sort_within_sections = true
include_trailing_comma = true
line_length = 100
multi_line_output = 3

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
    # Unfortunately jaxtyping decorator creates a function that seems to mistakenly be identified as
    # not returning anything, so we have to disable the error below for now
    'assignment-from-no-return',
    'duplicate-code',
    'import-outside-toplevel',
    'missing-docstring',
    'locally-disabled',
    'too-few-public-methods',
    'too-many-instance-attributes',
    'use-dict-literal',
]

[tool.pylint.design]
max-args = 10
max-locals = 20
max-parents = 12


[tool.commitizen]
tag_format = "v$major.$minor.$patch"
[tool.bandit]
exclude_dirs = ["tests", "litemongo/_vendor"]
