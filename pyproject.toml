[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"


[project]
name = "litemongo"
dynamic = ["version"]
description = "File based MongoDB server with pymongo compatible API."
authors = [{ name = "Martin Uhrin", email = "martin.uhrin.10@ucl.ac.uk" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    "Topic :: Scientific/Engineering"
]
keywords = ["mongodb", "database", "sqlite", "disk-based"]
requires-python = ">=3.11"
dependencies = [
#    "mongomock @ git+https://github.com/muhrin/mongomock.git@extended-serverstore-support",
    "pymongo",
    "setuptools",
    # needed by mongomock:
    "packaging",
    "pytz",
    "sentinels",
]
[project.optional-dependencies]
backends = [
    "h5py",
    "tables",
]

[dependency-groups]
dev = [
    "flit",
    "pre-commit",
    "pytest",
    "ruff",
    "ty==0.0.89",  # Pinned as new releases add checks
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/litemongo/_vendor"]

[tool.ruff.format]
exclude = ["docs/**", "tests/**"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle and pyflakes
    "C90",  # mccabe complexity
    "I",  # isort
    "A",  # shadowing builtins
    "B",  # bugbear: likely bugs and design problems
    "PL",  # pylint
]
ignore = [
    "E501",  # line length is handled by the formatter
    "F401",
    "F403",
    "PLC0415",  # imports outside top level are used to avoid circular imports
    "PLR2004",  # magic value comparisons
    "PLW1641",  # __eq__ without __hash__ (Python already makes these unhashable)
]

[tool.ruff.lint.per-file-ignores]
# Tests and docs were not import-sorted before the switch to ruff
"tests/**" = ["I"]
# Most of the tests come from mongomock, so only hold litemongo's own code to the stricter rules
"tests/{diff,test_*_store}.py" = ["I", "A", "B", "PL"]
"docs/**" = ["I"]

[tool.ruff.lint.flake8-builtins]
# These shadow builtins but mirror pymongo's API
ignorelist = ["filter", "id", "type"]

[tool.ruff.lint.pylint]
max-args = 10
max-locals = 20

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests", "scripts"]
exclude = [
    # Vendored third-party code
    "src/litemongo/_vendor",
    # Files that do not pass ty yet.  Please remove files from this list as they are fixed so
    # that they are checked from then on, the aim being to remove these altogether.
    "src/litemongo/client.py",
    "src/litemongo/h5py_store.py",
    "src/litemongo/pytables_store.py",
    "src/litemongo/sqlite_store.py",
    "tests/diff.py",
    "tests/test_h5py_store.py",
    "tests/test_pytables_store.py",
    "tests/test_query_planning.py",
    "tests/test_sqlite_store.py",
]

[tool.commitizen]
tag_format = "v$major.$minor.$patch"
[tool.bandit]
exclude_dirs = ["tests", "src/litemongo/_vendor"]
