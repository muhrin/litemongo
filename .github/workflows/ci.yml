name: continuous-integration

on: [ push, pull_request, workflow_dispatch ]

env:
  DEFAULT_PYTHON: '3.13'

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true

      - name: Install python dependencies
        run: uv sync --locked

      - name: Run pre-commit
        run:
          uv run pre-commit run --all-files || ( git status --short ; git diff ; exit 1 )

  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14' ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install python dependencies
        run: uv sync --locked --all-extras

      - name: Run pytest
        run: uv run pytest -sv tests

  publish:
    name: Publish to PyPI
    needs: [ pre-commit, tests ]
    # Only from main (pushed or run manually), and never from forks
    if: >-
      github.repository == 'muhrin/litemongo' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # To create the tag and GitHub release

    steps:
      # Checks out and builds the package itself, and only publishes (and creates a v<version> tag
      # and GitHub release) if the version in src/litemongo/version.py is newer than on PyPI
      - uses: etils-actions/pypi-auto-publish@v1.5.6
        with:
          pypi-token: ${{ secrets.PYPI_API_TOKEN }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          parse-changelog: false
